<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">v15 표적 선택과 학습의 원리</title>
  <desc id="desc">위쪽 액터는 한 드론의 각 표적 후보에 대해 동료 정보를 가중해 읽고 표적별 점수를 낸다. 아래쪽 크리틱은 드론과 표적의 관계 및 전체 배정을 가중해 모아 팀 가치를 예측한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#507297"/></marker>
    <style>
      text{font-family:system-ui,'Noto Sans CJK KR','Nanum Gothic',sans-serif;fill:#17283d}
      .title{font-size:37px;font-weight:800}
      .sub{font-size:20px;fill:#43576e}
      .section{font-size:27px;font-weight:750}
      .box{fill:#fff;stroke:#9bb1ca;stroke-width:2}
      .blue{fill:#eaf3ff;stroke:#84a9d4}
      .mint{fill:#e7f8f2;stroke:#72b59c}
      .gold{fill:#fff4d9;stroke:#dcb76a}
      .violet{fill:#f1ecfa;stroke:#aa94ce}
      .boxTitle{font-size:22px;font-weight:750}
      .line{font-size:19px}
      .small{font-size:17px;fill:#4f6277}
      .arrow{fill:none;stroke:#507297;stroke-width:3;marker-end:url(#arrow)}
      .accent{fill:#1465a8;font-weight:750}
    </style>
  </defs>
  <rect x="0" y="0" width="1600" height="930" fill="#f8fbff"/>
  <text class="title" x="55" y="70">v15는 어떻게 표적을 고를까?</text>
  <text class="sub" x="57" y="107">같은 계산을 모든 드론과 모든 표적 후보에 반복한다.</text>

  <text class="section" x="58" y="163">액터: 드론 한 대가 표적을 고르는 계산</text>
  <rect class="box blue" x="55" y="190" rx="18" width="282" height="175"/>
  <text class="boxTitle" x="76" y="226">① 후보별 질문</text>
  <text class="line" x="76" y="266">드론 i가 표적 k를 고르면?</text>
  <text class="small" x="76" y="302">표적 상태 · 남은 시간</text>
  <text class="small" x="76" y="329">내 상태 · 이전 선택</text>

  <rect class="box mint" x="395" y="190" rx="18" width="292" height="175"/>
  <text class="boxTitle" x="417" y="226">② 동료를 살펴봄</text>
  <text class="line" x="417" y="266">다른 드론들은 어디에 있고</text>
  <text class="line" x="417" y="294">표적 k를 얼마나 고려하나?</text>
  <text class="small" x="417" y="329">활동 중인 동료만 사용</text>

  <rect class="box gold" x="748" y="190" rx="18" width="335" height="175"/>
  <text class="boxTitle" x="772" y="226">③ 관련성을 가중해서 합침</text>
  <text class="line" x="772" y="267">후보 (i,k)에 중요한 동료의</text>
  <text class="line" x="772" y="296">정보에 큰 가중치를 준다</text>
  <text class="small" x="772" y="329">이 부분이 attention · 두 번 반복</text>

  <rect class="box violet" x="1145" y="190" rx="18" width="395" height="175"/>
  <text class="boxTitle" x="1168" y="226">④ 표적 k의 점수</text>
  <text class="line" x="1168" y="264">표적마다 점수 하나를 낸다</text>
  <text class="accent" x="1168" y="302" font-size="21">T1: 1.4   T2: 0.3   T3: 2.1   …</text>
  <text class="small" x="1168" y="330">가능한 표적만 선택 후보에 포함</text>

  <path class="arrow" d="M337 277 H389"/>
  <path class="arrow" d="M687 277 H742"/>
  <path class="arrow" d="M1083 277 H1139"/>

  <rect class="box" x="748" y="406" rx="18" width="792" height="125"/>
  <text class="boxTitle" x="772" y="444">⑤ 점수에 따라 선택하고, 겹친 배정을 정리</text>
  <text class="line" x="772" y="480">평가에서는 가장 높은 점수의 표적을 선택한다.</text>
  <text class="small" x="772" y="508">여러 드론이 같은 표적에 몰리면 score resolver가 허용 인원을 정한다.</text>
  <path class="arrow" d="M1343 365 V399"/>
  <text class="small" x="55" y="457">같은 점수 계산을</text>
  <text class="small" x="55" y="483">T1, T2, T3, … 에 반복</text>

  <line x1="55" y1="575" x2="1540" y2="575" stroke="#c9d8e8" stroke-width="2"/>
  <text class="section" x="58" y="627">크리틱: 전체 배정의 팀 가치를 평가하는 계산</text>
  <rect class="box blue" x="55" y="655" rx="18" width="304" height="160"/>
  <text class="boxTitle" x="76" y="692">드론과 표적을 받음</text>
  <text class="line" x="76" y="728">각 드론 · 각 표적의 상태</text>
  <text class="line" x="76" y="757">남은 시간</text>
  <text class="small" x="76" y="789">팀 전체의 한 장면</text>

  <rect class="box mint" x="419" y="655" rx="18" width="314" height="160"/>
  <text class="boxTitle" x="441" y="692">배정 관계를 붙임</text>
  <text class="line" x="441" y="728">누가 어느 표적을 선택했나?</text>
  <text class="line" x="441" y="757">서로 얼마나 떨어졌나?</text>
  <text class="small" x="441" y="789">드론과 표적 사이의 연결</text>

  <rect class="box gold" x="793" y="655" rx="18" width="350" height="160"/>
  <text class="boxTitle" x="815" y="692">서로의 정보를 가중해 모음</text>
  <text class="line" x="815" y="728">표적이 드론들을 읽고</text>
  <text class="line" x="815" y="757">드론이 표적들을 읽는다</text>
  <text class="small" x="815" y="789">관계에 따라 attention · 두 번 반복</text>

  <rect class="box violet" x="1203" y="655" rx="18" width="337" height="160"/>
  <text class="boxTitle" x="1225" y="692">팀 가치 Q를 예측</text>
  <text class="line" x="1225" y="728">모든 드론·표적의 정보를</text>
  <text class="line" x="1225" y="757">한데 모아 숫자 하나로</text>
  <text class="small" x="1225" y="789">전체 배정 한 가지의 평가</text>
  <path class="arrow" d="M359 735 H413"/>
  <path class="arrow" d="M733 735 H787"/>
  <path class="arrow" d="M1143 735 H1197"/>

  <rect x="55" y="846" rx="12" width="1485" height="57" fill="#e9eef9"/>
  <text class="line" x="75" y="881">학습 연결: 크리틱이 다른 배정의 Q도 평가 → 한 드론의 선택 차이를 계산 → 위 액터의 점수 계산법을 갱신</text>
</svg>
