[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pointmass-observation-rl"
version = "0.5.0"
description = "Cooperative strike-target prioritization with CTDE MAPPO"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7,<4", "gymnasium>=1.0,<2", "tqdm>=4.66,<5"]

[project.optional-dependencies]
rl = ["torch>=2.3,<3"]

[project.scripts]
pointmass-rl = "pointmass_rl.cli:main"

[tool.setuptools.packages.find]
include = ["pointmass_rl*"]
