<h1>Point-mass RL · Strike 표적 우선순위</h1>
<p>메인 맵은 선택 드론 주변 확대 화면입니다. 드론은 타격 준비 중 표적 주위를 선회한 뒤 타격하며, 이 선회 궤적은 리플레이 전용 시각 효과입니다. Random은 비교용 정책이라 접근 중에도 표적을 자주 바꿀 수 있습니다.</p>
